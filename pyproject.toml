[project]
name = "evalsim"
version = "0.1.0"
description = "Closed-loop simulation-evaluation platform for autonomous-driving traffic simulators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
